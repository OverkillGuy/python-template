_subdirectory: template
_templates_suffix: .j2
# Require template update "conflict" flag:
_min_copier_version: 9.4.1
_skip_if_exists:
  - CHANGELOG.md
  - README.md
  - docs/source/index.md
  # pyproject.toml is updated via migration task = excluded
  # But only in updates from v1 to v2 = migration poetry -> uv
# FIXME: Refine the filter for excluding pyproject.toml ONLY on update AND when moving from v1 to v2 of template (other cases should be empty)
  - "{% if _copier_operation == 'update' -%}pyproject.toml{% endif %}"

# and _copier_answers._commit.startswith('v1')
# # Tasks (git init + commit + tag) interfere with the update process!
_tasks:
  - when: "{{ _copier_operation == 'copy' }}"
    command: >-
      export AUTHOR_NAME="{{author_name}}";
      export AUTHOR_EMAIL="{{author_email}}";
      export TEMPLATE="{{project_slug}}";
      export TGTDIR="{{ _copier_conf.dst_path }}";
      {{_copier_conf.src_path}}/hooks/git_init_project
_migrations:
  - version: v2.0.0a8
    command: cat pyproject.toml && uvx migrate-to-uv && uv lock && cat pyproject.toml
    when: "{{ _stage == 'before' }}"
project_name:
  type: str
  help: "What is your project name? (format: Capitalized With Spaces)"
  placeholder: My Lovely Project
  validator: >-
    {% if not (project_name | regex_search('^[A-Z0-9].+$')) %}
    Project_name must start Capitalized (regex '^[A-Z0-9].+$')
    {% endif %}

description:
  type: str
  placeholder: "A python project to do things"

python_version:
  type: str
  default: "3.13"
  choices:
   - "3.10"
   - "3.11"
   - "3.12"
   - "3.13"
   - "3.14"

author_name:
  type: str
  help: The author of this package and template
  default: "Jb Doyon"

author_email:
  type: str
  help: The email of author
  default: "jb@jiby.tech"
  validator: >-
    {% if not (author_email | regex_search('^[^@]+@[^@]+\.[^@]+$')) %}
    Email invalid
    {% endif %}

project_slug:
  type: str
  default: "{{project_name|trim|lower|replace(' ', '-')}}"

package_name:
  type: str
  default: "{{ project_slug | lower | replace('-', '_') }}"
